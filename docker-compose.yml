services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      # Keep the application-facing name stable while tolerating older local
      # .env files that used MICROSOFT_TENANT_ID.
      MICROSOFT_APP_TENANT_ID: ${MICROSOFT_APP_TENANT_ID:-${MICROSOFT_TENANT_ID}}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-enterprise_risk_bot}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3978:3978"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3978/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  hourly-card-updater:
    build: .
    profiles: ["hourly-updates"]
    command: ["python", "-m", "src.workers.hourly_card_update_worker"]
    env_file:
      - .env
    environment:
      MICROSOFT_APP_TENANT_ID: ${MICROSOFT_APP_TENANT_ID:-${MICROSOFT_TENANT_ID}}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-enterprise_risk_bot}
      HOURLY_CARD_UPDATE_WORKER_ENABLED: "true"
      HOURLY_CARD_UPDATE_BATCH_SIZE: ${HOURLY_CARD_UPDATE_BATCH_SIZE:-100}
      HOURLY_CARD_UPDATE_HEARTBEAT_SECONDS: ${HOURLY_CARD_UPDATE_HEARTBEAT_SECONDS:-30}
      HOURLY_CARD_UPDATE_LEASE_SECONDS: ${HOURLY_CARD_UPDATE_LEASE_SECONDS:-90}
      HOURLY_CARD_UPDATE_LEGACY_HEARTBEAT_STALE_SECONDS: ${HOURLY_CARD_UPDATE_LEGACY_HEARTBEAT_STALE_SECONDS:-180}
      TEAMS_MESSAGE_UPDATE_TIMEOUT_SECONDS: ${TEAMS_MESSAGE_UPDATE_TIMEOUT_SECONDS:-25}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.workers.hourly_card_update_healthcheck"]
      interval: 30s
      timeout: 5s
      # A heartbeat is written every 30 seconds.  120 seconds allows one
      # bounded Mongo/Teams operation and small Docker clock differences.
      start_period: 120s
      retries: 4
  mongodb:
    image: mongo:8.0
    ports:
      - "27018:27017"
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
